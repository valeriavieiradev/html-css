<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Tabelas
        <style>
        body { 
                font-family: Arial, Helvetica, sans-serif;
        }
            table { 
                 border-collapse: collapse; 
            }
                    
          td { 
                border-collapse: collapse;
                width: 50px;
                text-align: center;
                line-height: 30px;
                border: 1px solid black;
            }
         
        </style>

    </title>
</head>
<body>
    <table>
        <thead>
        <tr>
            <td rowspan="2" scope="row" >Área</td>
            <td colspan="2" scope="col">Disciplinas</td>
            <td colspan="2">Nota1</td>
            <td>Nota 2</td>
            <td>Média</td>
        </tr>
        </thead>
        <tr>
            <th colspan="4" scope="col">Exatas</th>
            <td >Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
         <tr>
            <td>1</td>
            <td></td>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
         <tr>
            <td></td>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

    </table>
    
</body>
</html>
