<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de tabelas</title>
   <Style>
        body {
            font-family: Arial, Helvetica, sans-serif;
         }
        table {
            width: px;
            border-collapse: collapse;
        }
        caption {
            font-size: 1.3em;
            font-weight: border;
        padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        tr.destaque {
            background-color: rgb(247, 45, 149);
        }
        

   </Style>
   
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>
        <caption>Cadastro</caption>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Marieta</td>
            <td>F</td>
            <td>37</td>
            <td>Cozinheira</td>
        </tr>
        <tr>
            <td>Marcelo</td>
            <td>M</td>
            <td>32</td>
            <td>Padeiro</td>
        </tr>
        <tr>
            <td>Thales</td>
            <td>M</td>
            <td>20</td>
            <td>Programador</td>
        </tr>

        <tr class="destaque">
            <td>Valéria</td>
            <td>F</td>
            <td>45</td>
            <td>Professora</td>
        </tr>

    </table>
</body>
</html>
